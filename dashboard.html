<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bella Massa — Dashboard</title>
  <link rel="icon" type="image/png" href="src/img/bella.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div class="bg-pizzaria"></div>

  <div class="painel">
    <div class="topo">
      <h1>📊 Bella Massa — Dashboard</h1>
      <div class="topo-direita">
        <span id="usuarioLogado" style="font-size:13px;color:var(--mut);"></span>
        <a href="cadastro.html" id="btnCadastrarFuncionario" class="btn-sair"
           style="background: var(--gold); color: #2a1d00; text-decoration: none; display: none; align-items: center; gap: 6px;">
          ➕ Cadastrar Funcionário
        </a>
        <button class="btn-sair" onclick="sair()">🚪 Sair</button>
      </div>
    </div>

    <!-- Filtro de período -->
    <div class="filtro-periodo">
      <button class="btn-filtro ativo" data-periodo="hoje">📅 Hoje</button>
      <button class="btn-filtro" data-periodo="semana">📆 Semana</button>
      <button class="btn-filtro" data-periodo="mes">🗓️ Mês</button>
    </div>

    <!-- Cards -->
    <div class="cards-resumo">
      <div class="card-resumo">
        <span class="label">💰 Faturamento</span>
        <strong id="totalFaturamento">R$ 0,00</strong>
      </div>
      <div class="card-resumo">
        <span class="label">📦 Pedidos</span>
        <strong id="totalPedidos">0</strong>
      </div>
      <div class="card-resumo">
        <span class="label">🍕 Pizzas</span>
        <strong id="totalPizzas">0</strong>
      </div>
      <div class="card-resumo">
        <span class="label">🥤 Bebidas</span>
        <strong id="totalBebidas">0</strong>
      </div>
      <div class="card-resumo">
        <span class="label">📈 Ticket médio</span>
        <strong id="ticketMedio">R$ 0,00</strong>
      </div>
      <div class="card-resumo">
        <span class="label">⏱️ Tempo médio</span>
        <strong id="tempoMedio">15 min</strong>
      </div>
    </div>

    <!-- Gráficos -->
    <div class="grid-graficos">

      <div class="card-grafico">
        <h3>🍕 Top 5 Pizzas</h3>
        <div class="chart-wrapper"><canvas id="graficoPizzas"></canvas></div>
      </div>

      <div class="card-grafico">
        <h3>💰 Formas de Pagamento</h3>
        <div class="chart-wrapper"><canvas id="graficoPagamento"></canvas></div>
      </div>

      <div class="card-grafico card-full">
        <h3>📈 Faturamento por Hora</h3>
        <div class="chart-wrapper"><canvas id="graficoHoras"></canvas></div>
      </div>

      <div class="card-grafico card-full">
        <h3>📊 Faturamento por Mesa</h3>
        <div class="chart-wrapper"><canvas id="graficoMesas"></canvas></div>
      </div>

      <div class="card-grafico card-full">
        <h3>🥤 Bebidas Mais Vendidas</h3>
        <div class="chart-wrapper"><canvas id="graficoBebidas"></canvas></div>
      </div>

    </div>

    <div class="resumo-detalhado">
      <h3>📋 Resumo Detalhado</h3>
      <div id="resumoDetalhado"></div>
    </div>

  </div>

  <script type="module" src="src/js/dashboard.js"></script>
</body>
</html>
