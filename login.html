<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bella Massa — Login</title>
  <link rel="icon" type="image/png" href="src/img/bella.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
  <link rel="stylesheet" href="src/css/global.css">
  <link rel="stylesheet" href="src/css/login.css">
</head>
<body class="body-login">

  <div class="bg-pizzaria"></div>

  <div class="login-box">
    <h1>🍕 Bella Massa</h1>
    <h2>🔒 Acesso Restrito</h2>
    <p class="mut">Área exclusiva para funcionários.</p>

    <label class="f" for="email">E-mail</label>
    <input type="email" id="email" placeholder="funcionario@bellamassa.com" autocomplete="email">

    <label class="f" for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">

    <button class="btn red" id="btnEntrar" style="margin-top:20px">Entrar no Sistema</button>

    <p class="erro hidden" id="msgErro"></p>
  </div>

  <script type="module" src="src/js/login.js"></script>
</body>
</html>
